[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-theme05"
version = "0.1.0"
description = "Samsung PRISM Theme 05 — Interruptible Real-Time Agents"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
