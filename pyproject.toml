[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janus"
version = "0.1.0"
description = "Janus — Samsung PRISM Theme 05: Interruptible Real-Time Agents"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# "tests": the evaluation-kit merge (commit 7da1fd1) added tests/__init__.py,
# which makes pytest import tests/ as a package and stop putting tests/ on
# sys.path -- every Janus test's `from conftest import ...` then failed to
# collect. Listing it here restores that without deleting the kit file.
pythonpath = ["src", ".", "tests"]
