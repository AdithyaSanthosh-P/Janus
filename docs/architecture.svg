<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1428A0"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="62" font-size="32" font-weight="700" fill="#0F172A">Janus — architecture</text>
  <text x="60" y="94" font-size="17" fill="#475569">Models propose, one synchronous kernel decides: interruptible, correction-safe, no double actions.</text>

  <!-- ============ 1. User ============ -->
  <g filter="url(#sh)">
    <rect x="60" y="300" width="170" height="220" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="145" cy="355" r="24" fill="#1428A0"/>
  <rect x="115" y="385" width="60" height="34" rx="17" fill="#1428A0"/>
  <text x="145" y="455" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">User</text>
  <text x="145" y="480" font-size="14" fill="#475569" text-anchor="middle">voice (full duplex)</text>
  <text x="145" y="499" font-size="14" fill="#475569" text-anchor="middle">+ camera</text>

  <!-- ============ 2. Real-time edge ============ -->
  <g filter="url(#sh)">
    <rect x="290" y="210" width="280" height="400" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  </g>
  <text x="310" y="245" font-size="13" font-weight="700" fill="#1D4ED8" letter-spacing="1.5">REAL-TIME EDGE</text>
  <text x="310" y="270" font-size="19" font-weight="700" fill="#0F172A">LiveKit voice worker</text>
  <g font-size="14" fill="#0F172A">
    <rect x="310" y="290" width="240" height="52" rx="9" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="325" y="312" font-weight="600">Silero VAD</text>
    <text x="325" y="331" fill="#475569" font-size="13">speech start / end-of-turn</text>
    <rect x="310" y="352" width="240" height="52" rx="9" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="325" y="374" font-weight="600">Speech-to-text</text>
    <text x="325" y="393" fill="#475569" font-size="13">gpt-4o-mini-transcribe · or Whisper</text>
    <rect x="310" y="414" width="240" height="52" rx="9" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="325" y="436" font-weight="600">Kokoro-82M TTS</text>
    <text x="325" y="455" fill="#475569" font-size="13">stops mid-word on CANCEL</text>
    <rect x="310" y="476" width="240" height="52" rx="9" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="325" y="498" font-weight="600">Camera sampler</text>
    <text x="325" y="517" fill="#475569" font-size="13">1 frame / s to the evidence store</text>
    <rect x="310" y="538" width="240" height="52" rx="9" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="325" y="560" font-weight="600">Voice bridge</text>
    <text x="325" y="579" fill="#475569" font-size="13">filters noise, timestamps events</text>
  </g>

  <!-- ============ 3. Kernel ============ -->
  <g filter="url(#sh)">
    <rect x="640" y="160" width="560" height="620" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <text x="664" y="197" font-size="13" font-weight="700" fill="#B45309" letter-spacing="1.5">SINGLE WRITER · ONE SYNCHRONOUS STEP · UNDER 5 ms</text>
  <text x="664" y="224" font-size="22" font-weight="700" fill="#0F172A">Janus coordination kernel</text>

  <!-- step pipeline -->
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">
    <rect x="664" y="246" width="66" height="36" rx="8" fill="#B45309"/><text x="697" y="269">Drain</text>
    <rect x="738" y="246" width="66" height="36" rx="8" fill="#B45309"/><text x="771" y="269">Order</text>
    <rect x="812" y="246" width="66" height="36" rx="8" fill="#B45309"/><text x="845" y="269">Apply</text>
    <rect x="886" y="246" width="84" height="36" rx="8" fill="#DC2626"/><text x="928" y="269">Invalidate</text>
    <rect x="978" y="246" width="66" height="36" rx="8" fill="#B45309"/><text x="1011" y="269">Decide</text>
    <rect x="1052" y="246" width="66" height="36" rx="8" fill="#B45309"/><text x="1085" y="269">Emit</text>
    <rect x="1126" y="246" width="50" height="36" rx="8" fill="#B45309"/><text x="1151" y="269">Log</text>
  </g>

  <!-- store -->
  <rect x="664" y="304" width="250" height="210" rx="12" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="682" y="332" font-size="16" font-weight="700" fill="#0F172A">Versioned session store</text>
  <g font-size="13.5" fill="#334155">
    <text x="682" y="360">• Facts as (key, version, digest)</text>
    <text x="682" y="384">• Dependency index</text>
    <text x="682" y="408">• Call ledger &amp; effect ledger</text>
    <text x="682" y="432">• Plans, goals, floor state</text>
    <text x="682" y="456">• Camera evidence &amp; claims</text>
    <text x="682" y="490" fill="#64748B" font-size="12.5">Only the kernel writes here.</text>
  </g>

  <!-- safety -->
  <rect x="930" y="304" width="246" height="210" rx="12" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="948" y="332" font-size="16" font-weight="700" fill="#0F172A">Safety mechanisms</text>
  <g font-size="13.5" fill="#334155">
    <text x="948" y="360">• Read-set validation</text>
    <text x="948" y="378" fill="#64748B" font-size="12.5">   stale work is discarded</text>
    <text x="948" y="402">• Same-step cancellation</text>
    <text x="948" y="420" fill="#64748B" font-size="12.5">   a correction cancels at once</text>
    <text x="948" y="444">• Emission order</text>
    <text x="948" y="462" fill="#64748B" font-size="12.5">   CANCEL before SPEAK / CALL</text>
    <text x="948" y="486">• Honest replies from ledger</text>
  </g>

  <!-- commit gate -->
  <rect x="664" y="532" width="512" height="112" rx="12" fill="#1428A0"/>
  <text x="684" y="562" font-size="17" font-weight="700" fill="#FFFFFF">CommitGate — every write passes here (G1–G11)</text>
  <g font-size="13.5" fill="#DBEAFE">
    <text x="684" y="590">user has finished speaking · explicit go-ahead · no duplicate fingerprint</text>
    <text x="684" y="612">or lineage · settle window elapsed · recorded in the ledger before it is sent</text>
  </g>

  <!-- task machine -->
  <rect x="664" y="660" width="250" height="96" rx="12" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="682" y="688" font-size="15" font-weight="700" fill="#0F172A">Task state machine</text>
  <text x="682" y="712" font-size="13" fill="#334155">plan · execute · clarify · recover</text>
  <text x="682" y="734" font-size="13" fill="#334155">per-action arguments, late binding</text>
  <rect x="930" y="660" width="246" height="96" rx="12" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="948" y="688" font-size="15" font-weight="700" fill="#0F172A">Fast responder</text>
  <text x="948" y="712" font-size="13" fill="#334155">instant ACK · clarify · FINAL</text>
  <text x="948" y="734" font-size="13" fill="#334155">grounded in real tool results</text>

  <!-- ============ 4. Workers ============ -->
  <g filter="url(#sh)">
    <rect x="1270" y="160" width="280" height="330" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  </g>
  <text x="1290" y="195" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="0.8">ASYNC WORKERS · PROPOSE ONLY</text>
  <g font-size="14" fill="#0F172A">
    <rect x="1290" y="212" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/><text x="1305" y="237" font-weight="600">Interpreter <tspan fill="#64748B" font-weight="400" font-size="12.5">(speculative)</tspan></text>
    <rect x="1290" y="260" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/><text x="1305" y="285" font-weight="600">Planner <tspan fill="#64748B" font-weight="400" font-size="12.5">/ direct compile</tspan></text>
    <rect x="1290" y="308" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/><text x="1305" y="333" font-weight="600">Composer</text>
    <rect x="1290" y="356" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/><text x="1305" y="381" font-weight="600">Vision <tspan fill="#64748B" font-weight="400" font-size="12.5">(camera)</tspan></text>
  </g>
  <rect x="1290" y="414" width="240" height="56" rx="10" fill="#6D28D9"/>
  <text x="1410" y="439" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gemini 3.6 Flash</text>
  <text x="1410" y="459" font-size="12.5" fill="#EDE9FE" text-anchor="middle">hosted · temperature 0</text>

  <!-- ============ 5. Tools ============ -->
  <g filter="url(#sh)">
    <rect x="1270" y="540" width="280" height="240" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  </g>
  <text x="1290" y="575" font-size="13" font-weight="700" fill="#15803D" letter-spacing="1.5">TOOLS</text>
  <g font-size="14" fill="#0F172A">
    <rect x="1290" y="590" width="240" height="52" rx="8" fill="#FFFFFF" stroke="#BBF7D0"/>
    <text x="1305" y="612" font-weight="600">Reads</text>
    <text x="1305" y="631" fill="#475569" font-size="12.5">speculated, retried, in parallel</text>
    <rect x="1290" y="650" width="240" height="52" rx="8" fill="#FFFFFF" stroke="#BBF7D0"/>
    <text x="1305" y="672" font-weight="600">Writes</text>
    <text x="1305" y="691" fill="#475569" font-size="12.5">via CommitGate, exactly once</text>
    <text x="1305" y="728" font-size="13" fill="#334155">FDB-v3 domain tools</text>
    <text x="1305" y="750" font-size="13" fill="#334155">Device-care extension tools</text>
  </g>

  <!-- ============ Arrows ============ -->
  <!-- user <-> edge -->
  <line x1="232" y1="410" x2="286" y2="410" stroke="#475569" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <!-- edge -> kernel -->
  <line x1="572" y1="360" x2="636" y2="360" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="604" y="345" font-size="12" fill="#475569" text-anchor="middle">events</text>
  <!-- kernel -> edge -->
  <line x1="636" y1="470" x2="572" y2="470" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="604" y="492" font-size="12" fill="#DC2626" text-anchor="middle">speak</text><text x="604" y="507" font-size="12" fill="#DC2626" text-anchor="middle">cancel</text>
  <!-- kernel -> workers -->
  <line x1="1202" y1="250" x2="1266" y2="250" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1234" y="236" font-size="12" fill="#6D28D9" text-anchor="middle">jobs</text>
  <!-- workers -> kernel -->
  <line x1="1266" y1="330" x2="1202" y2="330" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1234" y="352" font-size="11.5" fill="#6D28D9" text-anchor="middle">proposals</text>
  <text x="1234" y="366" font-size="11.5" fill="#6D28D9" text-anchor="middle">+ read sets</text>
  <!-- gate -> tools -->
  <line x1="1178" y1="588" x2="1266" y2="620" stroke="#15803D" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="1218" y="580" font-size="12" fill="#15803D" text-anchor="middle">calls</text>
  <!-- tools -> kernel -->
  <line x1="1266" y1="700" x2="1202" y2="700" stroke="#15803D" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="1234" y="722" font-size="12" fill="#15803D" text-anchor="middle">results</text>

  <!-- ============ Footer: principles ============ -->
  <g font-size="14.5" fill="#0F172A">
    <rect x="60" y="822" width="1490" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="92" cy="856" r="6" fill="#1428A0"/>
    <text x="108" y="861"><tspan font-weight="700">No model acts on its own.</tspan> Workers return proposals; only the kernel changes state or talks to the user.</text>
    <circle cx="92" cy="890" r="6" fill="#DC2626"/>
    <text x="108" y="895"><tspan font-weight="700">Corrections are safe.</tspan> Every result records the facts it read; if one changes, that work is cancelled in the same step (a value that changes back, Pune, Mumbai, Pune, redoes nothing).</text>
  </g>
</svg>
