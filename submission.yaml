# Samsung PRISM GenAI Hackathon 3.0 - Theme 05: Interruptible Real-Time Agents
# Janus submission metadata (format: docs/SUBMISSION.md).
#
# TEAM NAME IS NOT SET. FAQ Q12 requires CollegeName_TeamName; the real
# value is not recorded anywhere in this repository, so this is an explicit
# placeholder, not a team identity. Replace it before any real submission.
team: "UNSET_CollegeName_TeamName"

entry_point: "agent.agent:ParticipantAgent"   # module:Class
python: "3.11"                                 # the version Janus is verified on (Docker, python:3.11-slim)

# Janus's runtime path (agent/, src/prism_rt/, config/) imports only the
# standard library: the Gemini provider talks to the REST API via urllib.
requirements: []

# Gemini API key for the live model provider. agent/agent.py reads
# SECRET_GEMINI_API_KEY (the kit's convention for portal-injected secrets),
# falling back to GEMINI_API_KEY for local runs. Values are never committed.
env:
  - SECRET_GEMINI_API_KEY
